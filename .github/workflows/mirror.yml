name: Mirror to Codeberg

# Runs after CI rather than alongside it, so a red build is never mirrored.
#
# Tags need their own trigger. CI only runs on pushes to main, so pushing a tag
# produces no workflow_run and the tag would sit on GitHub forever without ever
# reaching Codeberg. A tag points at a commit that has already been through CI,
# so there is nothing to wait for.
#
# `delete` is likewise not a workflow_run event, so deletions are caught
# directly; the push itself is --prune, which is what propagates them.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  delete:

concurrency: mirror

jobs:
  mirror:
    runs-on: ubuntu-latest
    # Deletions and tags have no build of their own to wait on. Anything
    # arriving via workflow_run has to have passed.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Clone source
        run: git clone --bare https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git src

      - name: Push to Codeberg
        env:
          SSH_KEY: ${{ secrets.CODEBERG_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan codeberg.org >> ~/.ssh/known_hosts
          cd src
          git push --force --prune \
            git@codeberg.org:BenDoubleU/${{ github.event.repository.name }}.git \
            'refs/heads/*:refs/heads/*' 'refs/tags/*:refs/tags/*'
